name: check

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No install step: the toolchain and the test harness use Node built-ins
      # only, which is the same reason they run on Termux.
      - name: Validate
        run: npm run validate

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: mcaddon
          path: dist/*.mcaddon
          if-no-files-found: error